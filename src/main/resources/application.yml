spring:
  application:
    name: rag-qa
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: rag
    password: rag
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema, Hibernate only checks it
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  ai:
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 384
        distance-type: COSINE_DISTANCE
        index-type: HNSW
    embedding:
      transformer:
        onnx:
          model-uri: file:${user.home}/models/all-MiniLM-L6-v2/model.onnx
        tokenizer:
          uri: file:${user.home}/models/all-MiniLM-L6-v2/tokenizer.json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
  chunking:
    max-chars: 400
    overlap-chars: 80
  upload:
    max-bytes: 10485760